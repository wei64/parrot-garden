<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe8ff" />
    <meta name="description" content="我的小游戏厅：挑一个游戏开始玩。" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>我的游戏厅</title>
    <link rel="stylesheet" href="./lobby.css" />
  </head>
  <body>
    <main class="lobby">
      <header class="lobby-header">
        <p class="eyebrow">我的游戏厅</p>
        <h1>挑一个游戏开始玩</h1>
        <p class="lobby-sub">每个游戏都能单独打开，玩完随时回到这里。</p>
      </header>

      <!--
        新增游戏：在下面 .game-grid 里加一个 <a class="game-card">，
        并把 games/<目录>/ 建好。字段约定见 AGENTS.md。
      -->
      <ul class="game-grid">
        <li>
          <a class="game-card" href="./games/parrot/index.html">
            <span class="card-cover" aria-hidden="true">
              <img src="./favicon.svg" alt="" width="64" height="64" />
            </span>
            <span class="card-body">
              <span class="card-title">小鹦鹉 · 成长花园</span>
              <span class="card-desc">陪着乐乐记录心情，看它一天天长大。</span>
            </span>
            <span class="card-go" aria-hidden="true">
              开玩
              <svg viewBox="0 0 24 24">
                <path d="M5 12h14"></path>
                <path d="m13 6 6 6-6 6"></path>
              </svg>
            </span>
          </a>
        </li>

        <li>
          <a class="game-card" href="./games/emotion/index.html">
            <span class="card-cover" aria-hidden="true">
              <img src="./games/emotion/favicon.svg" alt="" width="64" height="64" />
            </span>
            <span class="card-body">
              <span class="card-title">情绪小管家</span>
              <span class="card-desc">点一点天空里的小情绪，看看小人怎么回应。</span>
            </span>
            <span class="card-go" aria-hidden="true">
              开玩
              <svg viewBox="0 0 24 24">
                <path d="M5 12h14"></path>
                <path d="m13 6 6 6-6 6"></path>
              </svg>
            </span>
          </a>
        </li>

        <li>
          <a class="game-card" href="./games/listen-garden/index.html">
            <span class="card-cover" aria-hidden="true">
              <img src="./games/listen-garden/favicon.svg" alt="" width="64" height="64" />
            </span>
            <span class="card-body">
              <span class="card-title">听人说话 · 小花园</span>
              <span class="card-desc">听到就加分，没听到就扣分，分数越高花开得越多。</span>
            </span>
            <span class="card-go" aria-hidden="true">
              开玩
              <svg viewBox="0 0 24 24">
                <path d="M5 12h14"></path>
                <path d="m13 6 6 6-6 6"></path>
              </svg>
            </span>
          </a>
        </li>

        <li>
          <div class="game-card is-soon" role="note">
            <span class="card-cover" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
              </svg>
            </span>
            <span class="card-body">
              <span class="card-title">更多游戏</span>
              <span class="card-desc">正在路上，想好了就加进来。</span>
            </span>
          </div>
        </li>
      </ul>
    </main>
  </body>
</html>
