<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f3efff">
<meta name="description" content="听人说话的小花园：听到就加分，没听到就扣分，分数越高花开得越多。">
<title>听人说话 · 小花园</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="game">

  <header class="topbar">
    <div class="title-wrap">
      <h1>听人说话<span class="dot">。</span>小花园</h1>
      <p class="subtitle">听到就点左边，没听到就点右边，分数越高花开得越多</p>
    </div>
    <div class="tools">
      <a class="back-to-lobby" href="../../index.html" aria-label="返回游戏大厅">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5"></path>
          <path d="m11 6-6 6 6 6"></path>
        </svg>
        <span>大厅</span>
      </a>
      <button class="ghost" id="undoBtn" type="button" disabled>撤销</button>
      <button class="ghost" id="resetBtn" type="button">重新开始</button>
    </div>
  </header>

  <section class="scoreboard">
    <div class="score-pill">
      <span class="score-label">我的分数</span>
      <strong class="score-value" id="scoreValue">0</strong>
    </div>
    <p class="score-tip" id="scoreTip" role="status" aria-live="polite">花园还空着，先点一个左边的按钮吧</p>
  </section>

  <main class="panels">
    <section class="panel" aria-labelledby="gainTitle">
      <h2 class="panel-title" id="gainTitle">
        听人说话
        <span class="panel-tag">加分</span>
      </h2>
      <div class="btn-list">
        <button class="score-btn" type="button" data-delta="1">
          <span class="btn-text"><b>一天</b><span>听人说话</span></span>
          <span class="btn-score">+1</span>
        </button>
        <button class="score-btn" type="button" data-delta="3">
          <span class="btn-text"><b>一周</b><span>听人说话</span></span>
          <span class="btn-score">+3</span>
        </button>
        <button class="score-btn" type="button" data-delta="6">
          <span class="btn-text"><b>一月</b><span>听人说话</span></span>
          <span class="btn-score">+6</span>
        </button>
        <button class="score-btn" type="button" data-delta="18">
          <span class="btn-text"><b>一季</b><span>听人说话</span></span>
          <span class="btn-score">+18</span>
        </button>
        <button class="score-btn" type="button" data-delta="20">
          <span class="btn-text"><b>一年</b><span>听人说话</span></span>
          <span class="btn-score">+20</span>
        </button>
      </div>
    </section>

    <section class="panel" aria-labelledby="loseTitle">
      <h2 class="panel-title" id="loseTitle">
        没听人说话
        <span class="panel-tag panel-tag--warn">扣分</span>
      </h2>
      <div class="btn-list">
        <button class="score-btn" type="button" data-delta="-2">
          <span class="btn-text"><b>一天一次</b><span>没听人说话</span></span>
          <span class="btn-score">−2</span>
        </button>
        <button class="score-btn" type="button" data-delta="-4">
          <span class="btn-text"><b>一天两次</b><span>没听人说话</span></span>
          <span class="btn-score">−4</span>
        </button>
        <button class="score-btn" type="button" data-delta="-6">
          <span class="btn-text"><b>一天三次</b><span>没听人说话</span></span>
          <span class="btn-score">−6</span>
        </button>
        <button class="score-btn" type="button" data-delta="-8">
          <span class="btn-text"><b>一天四次</b><span>没听人说话</span></span>
          <span class="btn-score">−8</span>
        </button>
        <button class="score-btn" type="button" data-delta="-10">
          <span class="btn-text"><b>一天五次</b><span>没听人说话</span></span>
          <span class="btn-score">−10</span>
        </button>
      </div>
    </section>
  </main>

  <section class="garden" id="garden" aria-label="小花园，分数越高花开得越多">
    <span class="sun" aria-hidden="true"></span>
    <span class="cloud cloud-a" aria-hidden="true"></span>
    <span class="cloud cloud-b" aria-hidden="true"></span>
    <div class="garden-hill hill-a" aria-hidden="true"></div>
    <div class="garden-hill hill-b" aria-hidden="true"></div>
    <div class="plants" id="plants" aria-hidden="true"></div>
    <div class="grass-edge" aria-hidden="true"></div>
  </section>

</div>

<script src="./app.js"></script>
</body>
</html>
